<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Tarjeta base redondeada tipo UNO -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGlow)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Cuatro cuadrantes con los colores oficiales UNO -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="7" y="7" width="50" height="50" rx="11"/>
    </clipPath>
    <!-- Rojo (superior-izq) -->
    <path d="M7 7 H32 V32 H7 Z" fill="#EF4444"/>
    <!-- Azul (superior-der) -->
    <path d="M32 7 H57 V32 H32 Z" fill="#3B82F6"/>
    <!-- Amarillo (inferior-izq) -->
    <path d="M7 32 H32 V57 H7 Z" fill="#F59E0B"/>
    <!-- Verde (inferior-der) -->
    <path d="M32 32 H57 V57 H32 Z" fill="#10B981"/>
  </g>

  <!-- Óvalo central blanco inclinado característico de UNO -->
  <ellipse cx="32" cy="32" rx="20" ry="12" fill="#FFFFFF" transform="rotate(-30 32 32)" filter="url(#shadow)"/>

  <!-- Letra 'U' estilizada en rojo o texto pop -->
  <text x="32" y="38" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        font-style="italic" 
        text-anchor="middle" 
        fill="#ED1C24" 
        transform="rotate(-15 32 32)">
    U
  </text>
</svg>